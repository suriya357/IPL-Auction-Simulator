{% extends 'base.html' %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center" style="min-height: 60vh;">
    <div class="col-md-6">
        <i class="bi bi-exclamation-triangle-fill text-danger opacity-25" style="font-size: 8rem;"></i>
        <h1 class="display-1 fw-900 text-danger">500</h1>
        <h3 class="fw-bold mb-4">Internal Server Error</h3>
        <p class="text-muted mb-5">Something went wrong on our end. The stump mic caught an error, and our third umpire is currently reviewing the footage.</p>
        <a href="/" class="btn btn-danger fw-bold rounded-pill px-4 py-2"><i class="bi bi-house-door-fill me-2"></i>Return Home</a>
    </div>
</div>
{% endblock %}
