{% extends 'base.html' %}

{% block title %}{{ action }} Player{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h1>{{ action }} Player</h1>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" type="text" name="name" value="{{ player.name if player.name else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <input class="form-control" type="text" name="role" value="{{ player.role if player.role else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Base Price</label>
        <input class="form-control" type="number" step="0.01" name="base_price" value="{{ player.base_price if player.base_price else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Rating</label>
        <input class="form-control" type="number" name="rating" min="1" max="100" value="{{ player.rating if player.rating else '' }}" required>
      </div>
      <button class="btn btn-primary" type="submit">{{ action }} Player</button>
      <a class="btn btn-secondary" href="/players">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
