{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center" style="min-height: 60vh;">
    <div class="col-md-6">
        <i class="bi bi-sign-dead-end text-muted opacity-25" style="font-size: 8rem;"></i>
        <h1 class="display-1 fw-900 text-primary">404</h1>
        <h3 class="fw-bold mb-4">Page Not Found</h3>
        <p class="text-muted mb-5">The page you are looking for has been caught behind the boundary line. It might have been moved or doesn't exist.</p>
        <a href="/" class="btn btn-primary fw-bold rounded-pill px-4 py-2"><i class="bi bi-house-door-fill me-2"></i>Return Home</a>
    </div>
</div>
{% endblock %}
