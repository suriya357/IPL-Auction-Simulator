{% extends 'base.html' %}

{% block title %}Teams Management{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Teams</h1>
  <a href="/teams/add" class="btn btn-success">Add Team</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Team Name</th>
      <th>Budget (Cr)</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for team in teams %}
    <tr>
      <td>{{ team.team_name }}</td>
      <td>{{ '%.2f'|format(team.budget) }}</td>
      <td>
        <a href="/teams/edit/{{ team.id }}" class="btn btn-sm btn-primary">Edit</a>
        <a href="/teams/delete/{{ team.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this team?');">Delete</a>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="3" class="text-center">No teams found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
